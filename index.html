<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Builder Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 2rem;
        }
        #network-container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            border: 1px solid #cbd5e0;
            border-radius: 0.75rem;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }
        .message-box {
            display: none;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: 600;
        }
        .message-box.show {
            display: block;
        }
        .message-box.success {
            background-color: #d1fae5;
            border-left: 4px solid #34d399;
            color: #065f46;
        }
        .message-box.error {
            background-color: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }
        .message-box.info {
            background-color: #e0f2fe;
            border-left: 4px solid #38bdf8;
            color: #075985;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl w-full text-center mb-8">
        <h1 class="text-4xl font-extrabold text-gray-800 mb-4">
            Network Builder Challenge
        </h1>
        <p class="text-gray-600 text-lg mb-4">
            Your challenge is to build the following basic network:
        </p>
        <ul class="list-disc list-inside text-left text-gray-700 max-w-md mx-auto mb-6">
            <li>**Devices:** Internet, Firewall, Router, Switch, Web Server, Database Server, 2 Client PCs, Wireless AP, Laptop.</li>
            </ul>
        <p class="text-gray-600 text-lg font-semibold">
            Drag the devices around to arrange them.
        </p>
    </div>

    <div id="network-container"></div>

    <div class="flex space-x-4 mb-8">
        <button id="checkNetworkBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200">
            Check Network
        </button>
        <button id="resetNetworkBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200">
            Reset Network
        </button>
    </div>

    <div id="feedbackMessage" class="message-box w-full max-w-md"></div>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('network-container');
            const checkNetworkBtn = document.getElementById('checkNetworkBtn');
            const resetNetworkBtn = document.getElementById('resetNetworkBtn');
            const feedbackMessage = document.getElementById('feedbackMessage');

            // _nk = internal node key (obfuscated), label = what users see on screen
            const targetNodesConfig = [
                { id: 'internet', label: 'Internet', _nk: 'xq7r2mf', group: 'wan', image: 'https://placehold.co/50x50/cccccc/000000?text=🌐', x: 450, y: 50 },
                { id: 'firewall', label: 'Firewall', _nk: 'b3tz9aw', group: 'security', image: 'https://placehold.co/50x50/ff7f50/ffffff?text=🛡️', x: 450, y: 150 },
                { id: 'router', label: 'Router', _nk: 'p8dn4vy', group: 'network', image: 'https://placehold.co/50x50/6a5acd/ffffff?text=📡', x: 450, y: 250 },
                { id: 'switch', label: 'Switch', _nk: 'k1ug6hc', group: 'network', image: 'https://placehold.co/50x50/4682b4/ffffff?text=🔄', x: 350, y: 350 },
                { id: 'webserver', label: 'Web Server', _nk: 'w5jl0xe', group: 'server', image: 'https://placehold.co/50x50/90ee90/000000?text=💻', x: 550, y: 350 },
                { id: 'dbserver', label: 'Database Server', _nk: 'n2qs8rb', group: 'server', image: 'https://placehold.co/50x50/add8e6/000000?text=💾', x: 150, y: 350 },
                { id: 'pc1', label: 'Client PC 1', _nk: 'f6oc3it', group: 'client', image: 'https://placehold.co/50x50/f0e68c/000000?text=🖥️', x: 250, y: 450 },
                { id: 'pc2', label: 'Client PC 2', _nk: 'v9lk5zu', group: 'client', image: 'https://placehold.co/50x50/f0e68c/000000?text=🖥️', x: 450, y: 450 },
                { id: 'wirelessap', label: 'Wireless AP', _nk: 'e4hw7gd', group: 'network', image: 'https://placehold.co/50x50/dda0dd/000000?text=📶', x: 650, y: 250 },
                { id: 'laptop', label: 'Laptop', _nk: 'j0yp1ns', group: 'client', image: 'https://placehold.co/50x50/f0e68c/000000?text= portátil', x: 650, y: 350 }
            ];

            // Edges reference _nk keys instead of human-readable labels
            const targetEdgesConfig = [
                { fromKey: 'xq7r2mf', toKey: 'b3tz9aw' },
                { fromKey: 'b3tz9aw', toKey: 'p8dn4vy' },
                { fromKey: 'p8dn4vy', toKey: 'k1ug6hc' },
                { fromKey: 'k1ug6hc', toKey: 'w5jl0xe' },
                { fromKey: 'k1ug6hc', toKey: 'n2qs8rb' },
                { fromKey: 'k1ug6hc', toKey: 'f6oc3it' },
                { fromKey: 'k1ug6hc', toKey: 'v9lk5zu' },
                { fromKey: 'p8dn4vy', toKey: 'e4hw7gd' },
                { fromKey: 'e4hw7gd', toKey: 'j0yp1ns' }
            ];

            // Build a lookup: _nk -> label (used internally for validation)
            const _nkToLabel = {};
            targetNodesConfig.forEach(n => { _nkToLabel[n._nk] = n.label; });

            let nodes = new vis.DataSet([]);
            let edges = new vis.DataSet([]);
            let network;

            function showFeedback(message, type) {
                feedbackMessage.textContent = message;
                feedbackMessage.classList.remove('hidden', 'success', 'error', 'info');
                feedbackMessage.classList.add('show', type);
            }

            function initializeNetwork() {
                nodes = new vis.DataSet(targetNodesConfig.map(node => {
                    const randomX = Math.random() * (container.clientWidth - 100) + 50;
                    const randomY = Math.random() * (container.clientHeight - 100) + 50;
                    return { ...node, x: randomX, y: randomY, fixed: false };
                }));
                edges = new vis.DataSet([]);

                const data = { nodes: nodes, edges: edges };

                const options = {
                    nodes: {
                        font: {
                            color: '#333333',
                            size: 14,
                            face: 'Roboto, sans-serif'
                        },
                        color: {
                            border: '#6b7280',
                            background: '#d1d5db',
                            highlight: { border: '#3b82f6', background: '#93c5fd' },
                            hover: { border: '#3b82f6', background: '#bfdbfe' }
                        },
                        shapeProperties: {
                            useBorderWithImage: true
                        },
                        size: 25
                    },
                    edges: {
                        color: {
                            color: '#6b7280',
                            highlight: '#3b82f6',
                            hover: '#3b82f6',
                            inherit: 'from',
                            opacity: 0.8
                        },
                        width: 2,
                        arrows: 'to',
                        font: {
                            align: 'middle',
                            color: '#4b5563',
                            size: 12,
                            face: 'Roboto, sans-serif'
                        },
                        smooth: {
                            enabled: true,
                            type: 'dynamic',
                            roundness: 0.5
                        }
                    },
                    physics: {
                        enabled: true,
                        barnesHut: {
                            gravitationalConstant: -2000,
                            centralGravity: 0.3,
                            springLength: 95,
                            springConstant: 0.04,
                            damping: 0.09,
                            avoidOverlap: 0.5
                        },
                        solver: 'barnesHut',
                        stabilization: {
                            enabled: true,
                            iterations: 2000,
                            updateInterval: 25,
                            fit: true
                        }
                    },
                    interaction: {
                        hover: true,
                        navigationButtons: true,
                        keyboard: true
                    },
                    layout: {
                        improvedLayout: true
                    },
                    manipulation: {
                        enabled: true,
                        addNode: false,
                        addEdge: function(edgeData, callback) {
                            if (edgeData.from === edgeData.to) {
                                showFeedback('Cannot connect a device to itself!', 'error');
                                callback(null);
                                return;
                            }
                            callback(edgeData);
                            showFeedback('Connection added. Keep building!', 'info');
                        },
                    }
                };

                network = new vis.Network(container, data, options);

                network.once('stabilizationIterationsDone', function() {
                    network.setOptions({ physics: false });
                    showFeedback("Drag devices to arrange them, then connect them!", 'info');
                });
            }

            function checkNetwork() {
                const userNodes = nodes.get();
                const userEdges = edges.get();

                const userNodeLabels = userNodes.map(n => n.label).sort();
                const targetNodeLabels = targetNodesConfig.map(n => n.label).sort();

                if (userNodeLabels.length !== targetNodeLabels.length ||
                    !userNodeLabels.every((val, index) => val === targetNodeLabels[index])) {
                    showFeedback('Incorrect devices or device count. Please review your nodes!', 'error');
                    return;
                }

                const userEdgeStrings = new Set();
                userEdges.forEach(edge => {
                    const fromNode = nodes.get(edge.from);
                    const toNode = nodes.get(edge.to);
                    if (fromNode && toNode) {
                        const sortedLabels = [fromNode.label, toNode.label].sort();
                        userEdgeStrings.add(`${sortedLabels[0]}-${sortedLabels[1]}`);
                    }
                });

                // Resolve _nk keys to labels for comparison
                const targetEdgeStrings = new Set();
                targetEdgesConfig.forEach(edge => {
                    const fromLabel = _nkToLabel[edge.fromKey];
                    const toLabel   = _nkToLabel[edge.toKey];
                    const sortedLabels = [fromLabel, toLabel].sort();
                    targetEdgeStrings.add(`${sortedLabels[0]}-${sortedLabels[1]}`);
                });

                if (userEdgeStrings.size !== targetEdgeStrings.size ||
                    ![...targetEdgeStrings].every(edgeStr => userEdgeStrings.has(edgeStr))) {
                    showFeedback('Incorrect connections. Please review your connections!', 'error');
                    return;
                }

                showFeedback('🎉 Congratulations! Your network is perfectly built!', 'success');
            }

            checkNetworkBtn.addEventListener('click', checkNetwork);
            resetNetworkBtn.addEventListener('click', initializeNetwork);

            initializeNetwork();
        });
    </script>
</body>
</html>
